*,*::before,*::after{box-sizing:border-box}

.back{display:block;text-align:center;margin-top:22px}

.pf [class]{transform-box:fill-box;transform-origin:center}

const pfHTML=(v,sz)=>{v=String(v||"");if(v.indexOf("data:image/")===0)return `<img class="pf pfi" style="width:${sz}px;height:${sz}px" src="${v.replace(/"/g,"")}" alt="">`;
 const i=parseInt(v.split(":")[1],10),a=AN[i>=0&&i<AN.length?i:0];return `<span class="pf" style="width:${sz}px;height:${sz}px;background:${a[0]}"><svg viewBox="0 0 100 100" width="100%" height="100%" aria-hidden="true">${a[1]}</svg></span>`};
function makePicker(host,initial,onChange){
 let val=initial||"anim:0",tab=val.indexOf("data:")===0?"lib":"anim",stream=null;
 const q=(s,r)=>(r||host).querySelector(s);
 const stop=()=>{if(stream){stream.getTracks().forEach(t=>t.stop());stream=null}};
 const prev=()=>{const e=q(".pk-prev");if(e)e.innerHTML=pfHTML(val,72)};
 const set=v=>{val=v;if(onChange)onChange(v);prev();host.querySelectorAll(".pk-grid button").forEach(b=>b.classList.toggle("sel",b.dataset.v===v))};
 const crop=(el,w,h)=>{const c=document.createElement("canvas");c.width=c.height=192;const s=Math.min(w,h);c.getContext("2d").drawImage(el,(w-s)/2,(h-s)/2,s,s,0,0,192,192);return c.toDataURL("image/jpeg",.85)};
 function draw(){stop();
  host.innerHTML=`<div class="pk"><div class="pk-top"><div class="pk-prev"></div><div class="pk-tabs" role="tablist">${[["lib","📁 Photo library"],["cam","📷 Take a photo"],["anim","✨ Animated"]].map(x=>`<button type="button" role="tab" data-t="${x[0]}" aria-selected="${tab===x[0]}">${x[1]}</button>`).join("")}</div></div><div class="pk-body"></div></div>`;
  prev();const body=q(".pk-body");
  host.querySelectorAll("[data-t]").forEach(b=>b.onclick=()=>{tab=b.dataset.t;draw()});
  if(tab==="anim"){body.innerHTML=`<div class="pk-grid">${AN.map((a,i)=>`<button type="button" data-v="anim:${i}" class="${val==="anim:"+i?"sel":""}" aria-label="Animated avatar ${i+1}">${pfHTML("anim:"+i,52)}</button>`).join("")}</div>`;body.querySelectorAll("button").forEach(b=>b.onclick=()=>set(b.dataset.v))}
  else if(tab==="lib"){body.innerHTML=`<input type="file" accept="image/*" aria-label="Choose a photo"><p class="hint">Pick a photo from your library. It’s cropped to a square.</p>`;
   q("input",body).onchange=e=>{const f=e.target.files[0];if(!f||f.type.indexOf("image/")!==0)return;const r=new FileReader();r.onload=()=>{const im=new Image();im.onload=()=>set(crop(im,im.width,im.height));im.src=r.result};r.readAsDataURL(f)}}
  else{body.innerHTML=`<button type="button" class="btn" id="pkCam">Open camera</button><video playsinline muted hidden></video><button type="button" class="btn fill" id="pkSnap" hidden>Take photo</button><p class="hint"></p>`;
   const v=q("video",body),hint=q(".hint",body);
   q("#pkCam",body).onclick=()=>{if(!navigator.mediaDevices||!navigator.mediaDevices.getUserMedia){hint.textContent="The camera isn’t available here. Try Photo library instead.";return}
    navigator.mediaDevices.getUserMedia({video:{facingMode:"user"}}).then(s=>{stream=s;v.srcObject=s;v.hidden=false;v.play();q("#pkSnap",body).hidden=false;q("#pkCam",body).hidden=true}).catch(()=>{hint.textContent="Couldn’t open the camera. Check your permissions or use Photo library."})};
   q("#pkSnap",body).onclick=()=>{if(v.videoWidth)set(crop(v,v.videoWidth,v.videoHeight));stop();draw()}}
 }
 draw();return {stop,get:()=>val};
}
let avatar="anim:0";makePicker($("#pk"),avatar,v=>avatar=v);
$("#f").onsubmit=async e=>{e.preventDefault();const m=$("#msg"),em=$("#em").value.trim(),pw=$("#pw").value;
 const bad=!/^\S+@\S+\.\S+$/.test(em)||pw.length<8||(SIGNUP&&$("#un").value.trim().length<3);
 m.className="msg "+(bad?"err":"ok");
 if(bad){m.textContent=T[lang].errS;return}
 const salt=Math.random().toString(36).slice(2);
 LSs("ma-profile",JSON.stringify({username:$("#un").value.trim(),email:em.toLowerCase(),salt,hash:await maHash(pw,salt),avatar}));
 LSs("ma-session","1");location.href="dashboard.html"};
let s="en";try{s=localStorage.getItem("ma-lang")||"en"}catch(e){}
setLang(T[s]?s:"en");
