<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>MathAnchor – Log in</title>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@500;700;800&family=Instrument+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#F2F7F4;--grid:#D3E3DC;--ink:#12263A;--mute:#4A6070;--card:#FFFFFF;--line:#B9CFC6;--mark:#FFD23F;--markink:#12263A;--teal:#0E7C6B;--bad:#B3261E;color-scheme:light}
@media (prefers-color-scheme:dark){:root{--bg:#0F1C26;--grid:#1B3041;--ink:#E8F0EE;--mute:#9DB3BF;--card:#16293A;--line:#2C4558;--teal:#4FD1B8;--bad:#FF8A80;color-scheme:dark}}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;min-height:100vh;background:var(--bg);color:var(--ink);font:400 1rem/1.6 "Instrument Sans",system-ui,"Noto Sans",sans-serif;padding:env(safe-area-inset-top,0px) 0 env(safe-area-inset-bottom,0px);
background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);background-size:32px 32px}
h1{font:800 clamp(1.9rem,5vw,2.4rem)/1.1 "Bricolage Grotesque","Instrument Sans",system-ui,sans-serif;margin:0 0 18px}
button,input{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--teal);outline-offset:2px}
a{color:var(--teal);font-weight:600}
header{background:var(--bg);border-bottom:1px solid var(--line)}
.bar{max-width:1040px;margin:0 auto;padding:0 20px;display:flex;align-items:center;gap:10px;height:60px}
.logo{font:800 1.25rem "Bricolage Grotesque",sans-serif;margin-right:auto;color:var(--ink);text-decoration:none;white-space:nowrap}
.logo span{background:var(--mark);color:var(--markink);padding:0 6px;border-radius:4px;margin-right:2px}
.btn{border:1.5px solid var(--ink);background:transparent;border-radius:8px;padding:8px 14px;font-weight:600;cursor:pointer}
.btn.fill{background:var(--mark);color:var(--markink);border-color:var(--markink)}
.lang{position:relative}
.menu{position:absolute;right:0;top:calc(100% + 6px);background:var(--card);border:1px solid var(--line);border-radius:10px;padding:6px;list-style:none;margin:0;width:200px;max-height:60vh;overflow:auto;display:none;box-shadow:0 8px 24px rgba(0,0,0,.18);z-index:5}
.menu.open{display:block}
.menu button{width:100%;text-align:left;border:0;background:none;padding:8px 10px;border-radius:6px;cursor:pointer}
.menu button:hover,.menu button[aria-current="true"]{background:var(--grid)}
.menu button[disabled]{opacity:.5;cursor:default}
main{max-width:420px;margin:0 auto;padding:36px 20px 48px}
.card{background:var(--card);border:2px solid var(--ink);border-radius:14px;padding:24px;box-shadow:6px 6px 0 var(--mark)}
label{display:block;font-weight:600;margin:14px 0 4px}
input{width:100%;padding:11px;border:1.5px solid var(--line);border-radius:8px;background:var(--bg)}
.go{width:100%;margin-top:20px;padding:12px;font-size:1.05rem}
.msg{min-height:1.3em;margin-top:12px;font-size:.9rem}
.msg.err{color:var(--bad)}.msg.ok{color:var(--teal)}
.alt{margin-top:18px;color:var(--mute);text-align:center}
.back{display:block;text-align:center;margin-top:22px}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<header><div class="bar">
 <a class="logo" href="index.html"><span>Math</span>Anchor</a>
 <div class="lang"><button class="btn" id="langBtn" aria-haspopup="true" aria-expanded="false" aria-label="Language">🌐 <span id="langName">English</span></button><ul class="menu" id="menu"></ul></div>
</div></header>
<main>
 <div class="card">
  <h1 data-i="login">Log in</h1>
  <form id="f" novalidate>
   <label for="em" data-i="email">Email</label><input id="em" type="email" autocomplete="email">
   <label for="pw" data-i="pass">Password</label><input id="pw" type="password" autocomplete="current-password">
   <div class="msg" id="msg" role="alert"></div>
   <button class="btn fill go" type="submit" data-i="login">Log in</button>
  </form>
  <p class="alt"><span data-i="no">New here?</span> <a href="signup.html" data-i="signup">Sign up</a></p>
 </div>
 <a class="back" href="index.html" data-i="back">Back to home</a>
</main>
<script>
const LANGS=[["en","English"],["es","Español"],["it","Italiano"],["pl","Polski"],["ru","Русский"],["uk","Українська"],["zh","中文"],["hi","हिन्दी"],["de","Deutsch"],["fr","Français"],["pt","Português"],["ar","العربية"],["ja","日本語"],["ko","한국어"],["tr","Türkçe"]];
const T={"en": {"login": "Log in", "signup": "Sign up", "email": "Email", "pass": "Password", "no": "New here?", "has": "Already have an account?", "back": "Back to home", "user": "Username", "errL": "Check your details: a valid email and a password of 8+ characters.", "errS": "Check your details: username of 3+ characters, a valid email and a password of 8+ characters.", "note": "Preview only: nothing was sent or saved."}, "es": {"login": "Iniciar sesión", "signup": "Registrarse", "email": "Correo", "pass": "Contraseña", "no": "¿Eres nuevo?", "has": "¿Ya tienes cuenta?", "back": "Volver al inicio", "user": "Nombre de usuario", "errL": "Revisa tus datos: un correo válido y una contraseña de 8+ caracteres.", "errS": "Revisa tus datos: usuario de 3+ caracteres, correo válido y contraseña de 8+ caracteres.", "note": "Solo vista previa: no se envió ni guardó nada."}, "it": {"login": "Accedi", "signup": "Registrati", "email": "Email", "pass": "Password", "no": "Sei nuovo?", "has": "Hai già un account?", "back": "Torna alla home", "user": "Nome utente", "errL": "Controlla i dati: email valida e password di almeno 8 caratteri.", "errS": "Controlla i dati: nome utente di almeno 3 caratteri, email valida e password di almeno 8 caratteri.", "note": "Solo anteprima: nulla è stato inviato o salvato."}, "pl": {"login": "Zaloguj się", "signup": "Zarejestruj się", "email": "E-mail", "pass": "Hasło", "no": "Pierwszy raz tutaj?", "has": "Masz już konto?", "back": "Wróć na stronę główną", "user": "Nazwa użytkownika", "errL": "Sprawdź dane: poprawny e-mail i hasło min. 8 znaków.", "errS": "Sprawdź dane: nazwa użytkownika min. 3 znaki, poprawny e-mail i hasło min. 8 znaków.", "note": "Tylko podgląd: nic nie zostało wysłane ani zapisane."}, "ru": {"login": "Войти", "signup": "Регистрация", "email": "Эл. почта", "pass": "Пароль", "no": "Впервые здесь?", "has": "Уже есть аккаунт?", "back": "На главную", "user": "Имя пользователя", "errL": "Проверьте данные: корректная почта и пароль от 8 символов.", "errS": "Проверьте данные: имя от 3 символов, корректная почта и пароль от 8 символов.", "note": "Только предпросмотр: ничего не отправлено и не сохранено."}, "uk": {"login": "Увійти", "signup": "Реєстрація", "email": "Ел. пошта", "pass": "Пароль", "no": "Вперше тут?", "has": "Уже є акаунт?", "back": "На головну", "user": "Ім’я користувача", "errL": "Перевірте дані: коректна пошта та пароль від 8 символів.", "errS": "Перевірте дані: ім’я від 3 символів, коректна пошта та пароль від 8 символів.", "note": "Лише попередній перегляд: нічого не надіслано й не збережено."}, "zh": {"login": "登录", "signup": "注册", "email": "邮箱", "pass": "密码", "no": "新用户？", "has": "已有账户？", "back": "返回首页", "user": "用户名", "errL": "请检查：有效的邮箱，以及至少 8 位的密码。", "errS": "请检查：用户名至少 3 个字符，有效的邮箱，以及至少 8 位的密码。", "note": "仅为预览：没有发送或保存任何内容。"}, "hi": {"login": "लॉग इन", "signup": "साइन अप", "email": "ईमेल", "pass": "पासवर्ड", "no": "नए हैं?", "has": "पहले से खाता है?", "back": "होम पर वापस जाएँ", "user": "यूज़रनेम", "errL": "जानकारी जाँचें: सही ईमेल और कम से कम 8 अक्षरों का पासवर्ड।", "errS": "जानकारी जाँचें: कम से कम 3 अक्षरों का यूज़रनेम, सही ईमेल और कम से कम 8 अक्षरों का पासवर्ड।", "note": "केवल प्रीव्यू: कुछ भी भेजा या सहेजा नहीं गया।"}, "de": {"login": "Anmelden", "signup": "Registrieren", "email": "E-Mail", "pass": "Passwort", "no": "Neu hier?", "has": "Schon ein Konto?", "back": "Zurück zur Startseite", "user": "Benutzername", "errL": "Bitte prüfen: gültige E-Mail und Passwort mit mindestens 8 Zeichen.", "errS": "Bitte prüfen: Benutzername mit mindestens 3 Zeichen, gültige E-Mail und Passwort mit mindestens 8 Zeichen.", "note": "Nur Vorschau: nichts wurde gesendet oder gespeichert."}, "fr": {"login": "Connexion", "signup": "S’inscrire", "email": "E-mail", "pass": "Mot de passe", "no": "Nouveau ici ?", "has": "Déjà un compte ?", "back": "Retour à l’accueil", "user": "Nom d’utilisateur", "errL": "Vérifiez : un e-mail valide et un mot de passe de 8 caractères minimum.", "errS": "Vérifiez : un nom d’utilisateur de 3 caractères minimum, un e-mail valide et un mot de passe de 8 caractères minimum.", "note": "Aperçu seulement : rien n’a été envoyé ni enregistré."}};
const SIGNUP=false;let lang="en";
const $=s=>document.querySelector(s),$$=s=>document.querySelectorAll(s);
const menu=$("#menu"),btn=$("#langBtn");
LANGS.forEach(([c,n])=>{const li=document.createElement("li"),b=document.createElement("button"),ok=!!T[c];b.textContent=ok?n:n+" (soon)";b.disabled=!ok;b.dataset.c=c;b.onclick=()=>{setLang(c);toggle(false)};li.append(b);menu.append(li)});
function toggle(o){menu.classList.toggle("open",o);btn.setAttribute("aria-expanded",o)}
btn.onclick=e=>{e.stopPropagation();toggle(!menu.classList.contains("open"))};
document.addEventListener("click",()=>toggle(false));
function setLang(c){lang=c;document.documentElement.lang=c;try{localStorage.setItem("ma-lang",c)}catch(e){}
 $("#langName").textContent=LANGS.find(l=>l[0]===c)[1];
 $$("[data-i]").forEach(el=>{const v=T[c][el.dataset.i];if(v)el.textContent=v});
 $$(".menu button").forEach(b=>b.setAttribute("aria-current",b.dataset.c===c));
 document.title="MathAnchor – "+T[c][SIGNUP?"signup":"login"];$("#msg").textContent=""}
$("#f").onsubmit=e=>{e.preventDefault();const m=$("#msg"),em=$("#em").value.trim(),pw=$("#pw").value;
 const bad=!/^\S+@\S+\.\S+$/.test(em)||pw.length<8||(SIGNUP&&$("#un").value.trim().length<3);
 m.className="msg "+(bad?"err":"ok");m.textContent=T[lang][bad?(SIGNUP?"errS":"errL"):"note"];if(!bad)location.href="dashboard.html"};
let s="en";try{s=localStorage.getItem("ma-lang")||"en"}catch(e){}
setLang(T[s]?s:"en");
</script>
</body>
</html>
