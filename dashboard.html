<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>MathAnchor – Dashboard</title>
<link rel="icon" href="logo.svg" type="image/svg+xml">
<link rel="icon" href="favicon.png" type="image/png" sizes="64x64">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@500;700;800&family=Instrument+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#F2F7F4;--grid:#D3E3DC;--ink:#12263A;--mute:#4A6070;--card:#FFFFFF;--line:#B9CFC6;--mark:#FFD23F;--markink:#12263A;--teal:#0E7C6B;color-scheme:light}
@media (prefers-color-scheme:dark){:root{--bg:#0F1C26;--grid:#1B3041;--ink:#E8F0EE;--mute:#9DB3BF;--card:#16293A;--line:#2C4558;--teal:#4FD1B8;color-scheme:dark}}
*,*::before,*::after{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:400 1rem/1.6 "Instrument Sans",system-ui,sans-serif;padding:env(safe-area-inset-top,0px) 0 env(safe-area-inset-bottom,0px);display:flex;flex-direction:column}
h1,h2,h3{font-family:"Bricolage Grotesque","Instrument Sans",system-ui,sans-serif;line-height:1.15;margin:0}
button,input{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--teal);outline-offset:2px}
header{display:flex;align-items:center;gap:10px;padding:0 16px;height:60px;border-bottom:1px solid var(--line);background:var(--bg);flex:none}
.logo{display:flex;align-items:center;gap:8px;font:800 1.2rem "Bricolage Grotesque",sans-serif;color:var(--ink);text-decoration:none;white-space:nowrap;cursor:pointer}
.logo .m{background:var(--mark);color:var(--markink);padding:0 6px;border-radius:4px;margin-right:2px}
.search{flex:1;max-width:460px;margin-left:auto;padding:9px 12px;border:1.5px solid var(--line);border-radius:8px;background:var(--card)}
.btn{border:1.5px solid var(--ink);background:transparent;border-radius:8px;padding:8px 12px;font-weight:600;cursor:pointer}
.btn.fill{background:var(--mark);color:var(--markink);border-color:var(--markink)}
.btn.on{background:var(--teal);color:var(--bg);border-color:var(--teal)}
.layout{display:flex;flex:1;min-height:0}
aside{width:290px;flex:none;overflow-y:auto;border-right:1px solid var(--line);padding:14px 10px;background:var(--bg)}
aside h2{font-size:.8rem;letter-spacing:.08em;text-transform:uppercase;color:var(--mute);margin:0 8px 10px}
details{margin-bottom:2px}
summary{display:flex;align-items:center;gap:10px;padding:9px 10px;border-radius:8px;cursor:pointer;font-weight:600;list-style:none}
summary::-webkit-details-marker{display:none}
summary:hover,aside a:hover{background:var(--grid)}
summary .s{width:34px;text-align:center;font:700 1.05rem "Bricolage Grotesque",sans-serif;color:var(--teal)}
summary .c{margin-left:auto;font-size:.8rem;color:var(--mute);font-weight:500}
aside a{display:block;padding:7px 10px 7px 54px;border-radius:8px;color:var(--ink);text-decoration:none;font-size:.95rem}
aside a.ov{color:var(--mute)}
aside a.cur{background:var(--mark);color:var(--markink);font-weight:600}
aside a.done::after{content:" ✓";color:var(--teal)}
aside a.cur.done::after{color:var(--markink)}
main{flex:1;overflow-y:auto;padding:28px 24px 56px;background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);background-size:32px 32px}
.in{max-width:760px;margin:0 auto}
.in>h1{font-size:clamp(1.9rem,4.5vw,2.8rem);font-weight:800;letter-spacing:-.01em;margin-bottom:10px}
.lead{color:var(--mute);font-size:1.1rem;margin:0 0 24px;max-width:56ch}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:12px}
.tile{text-align:left;background:var(--card);border:2px solid var(--ink);border-radius:12px;padding:14px;cursor:pointer;display:flex;gap:12px;align-items:center}
.tile:hover{box-shadow:4px 4px 0 var(--mark)}
.tile .s{font:700 1.5rem "Bricolage Grotesque",sans-serif;color:var(--teal);width:40px;text-align:center}
.tile small{display:block;color:var(--mute)}
.chip{display:inline-block;background:var(--mark);color:var(--markink);font-weight:600;font-size:.85rem;border-radius:6px;padding:2px 10px;margin-bottom:12px;text-decoration:none}
.box{background:var(--card);border:2px solid var(--ink);border-radius:14px;padding:18px 20px;margin:16px 0}
.box h3{font-size:.85rem;letter-spacing:.08em;text-transform:uppercase;color:var(--teal);margin-bottom:6px}
.box p{margin:0}
.ex{box-shadow:6px 6px 0 var(--mark)}
.ex ol{margin:8px 0 0;padding:0;list-style:none;counter-reset:s}
.ex li{counter-increment:s;padding:10px 0 10px 40px;border-top:1px dashed var(--line);position:relative}
.ex li::before{content:counter(s);position:absolute;left:0;top:9px;width:26px;height:26px;border-radius:50%;background:var(--ink);color:var(--bg);font-weight:700;font-size:.85rem;display:grid;place-items:center}
.ex .q{font:700 1.2rem "Bricolage Grotesque",sans-serif}
.warn{border-color:#C0392B}
.warn h3{color:#C0392B}
@media (prefers-color-scheme:dark){.warn{border-color:#FF8A80}.warn h3{color:#FF8A80}}
.acts{display:flex;gap:10px;flex-wrap:wrap;margin-top:20px}
.res{list-style:none;padding:0;margin:0}
.res li{margin-bottom:10px}
.res button{width:100%;text-align:left;background:var(--card);border:2px solid var(--line);border-radius:10px;padding:12px 14px;cursor:pointer}
.res button:hover{border-color:var(--ink)}
.res small{color:var(--mute);display:block}
dialog{border:2px solid var(--ink);border-radius:14px;background:var(--card);color:var(--ink);width:min(540px,94vw);max-height:90vh;padding:0}
dialog::backdrop{background:rgba(10,20,30,.55)}
.dh{display:flex;justify-content:space-between;align-items:center;padding:14px 20px;border-bottom:1px solid var(--line)}
.dh h2{font-size:1.4rem}
.db{padding:4px 20px 20px;overflow:auto;max-height:calc(90vh - 66px)}
.sx{padding:16px 0;border-bottom:1px solid var(--line)}.sx:last-child{border:0}
.sx h3{font-size:1rem;margin-bottom:8px}
.row2{display:flex;gap:8px;margin-bottom:8px}.row2 input,select{flex:1;min-width:0;padding:10px;border:1.5px solid var(--line);border-radius:8px;background:var(--bg);font:inherit;color:inherit}
select{width:100%}
.st{min-height:1.2em;font-size:.88rem;margin:6px 0 0}.st.err{color:#C0392B}.st.ok{color:var(--teal)}.st.mute{color:var(--mute)}
.seg{display:flex;gap:6px;flex-wrap:wrap}.seg .btn[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
.btn.bad{border-color:#C0392B;color:#C0392B}.btn.bad.fill{background:#C0392B;color:#fff}
@media (prefers-color-scheme:dark){.st.err{color:#FF8A80}.btn.bad{border-color:#FF8A80;color:#FF8A80}}
.pf{display:inline-block;border-radius:50%;overflow:hidden;flex:none;vertical-align:middle}.pf svg{display:block}.pfi{object-fit:cover}
.pf [class]{transform-box:fill-box;transform-origin:center}
@keyframes pf-bob{50%{transform:translateY(-4px)}}@keyframes pf-float{50%{transform:translateY(-6px)}}
@keyframes pf-blink{0%,90%,100%{transform:scaleY(1)}95%{transform:scaleY(.1)}}
@keyframes pf-wig{0%,100%{transform:rotate(-6deg)}50%{transform:rotate(6deg)}}
@keyframes pf-pulse{50%{transform:scale(1.1)}}@keyframes pf-spin{to{transform:rotate(360deg)}}
@keyframes pf-flick{50%{transform:scaleY(1.3)}}@keyframes pf-swing{0%,100%{transform:rotate(-12deg)}50%{transform:rotate(12deg)}}
.pf .bob{animation:pf-bob 2.4s ease-in-out infinite}.pf .float{animation:pf-float 3s ease-in-out infinite}
.pf .blink{animation:pf-blink 4s infinite}.pf .wig{animation:pf-wig 1.6s ease-in-out infinite}
.pf .pulse{animation:pf-pulse 1.6s ease-in-out infinite}.pf .spin{animation:pf-spin 12s linear infinite}
.pf .flick{transform-origin:50% 0;animation:pf-flick .5s ease-in-out infinite}
.pf .swing{transform-box:view-box;transform-origin:50px 12px;animation:pf-swing 2.4s ease-in-out infinite}
@media (prefers-reduced-motion:reduce){.pf [class]{animation:none!important}}
.pk-top{display:flex;gap:14px;align-items:center;flex-wrap:wrap}.pk-tabs{display:flex;gap:6px;flex-wrap:wrap}
.pk-tabs button{border:1.5px solid var(--line);background:transparent;border-radius:8px;padding:6px 10px;cursor:pointer;font:inherit;color:inherit}
.pk-tabs button[aria-selected="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.pk-body{margin-top:12px}.pk-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(58px,1fr));gap:6px;max-height:210px;overflow:auto;padding:2px}
.pk-grid button{border:2px solid transparent;border-radius:50%;padding:2px;background:none;cursor:pointer}.pk-grid button.sel{border-color:var(--ink)}
.pk video{width:100%;max-width:260px;border-radius:10px;display:block;margin:8px 0}.pk .hint{font-size:.85rem;color:var(--mute);margin:6px 0 0}
.pk input[type=file]{max-width:100%}
.me{display:flex;align-items:center;gap:8px;font-weight:600;white-space:nowrap}.me b{max-width:130px;overflow:hidden;text-overflow:ellipsis}
@media (max-width:800px){.me b{display:none}}
.hero{position:relative;text-align:center;padding:38px 16px 32px;overflow:hidden;background:var(--card);border:2px solid var(--ink);border-radius:18px;box-shadow:6px 6px 0 var(--mark);margin-bottom:10px}
.hero>*:not(.sym){position:relative}
.hero h1{font-size:clamp(1.7rem,4.5vw,2.5rem);font-weight:800;margin:16px 0 6px}
.hero .lead{margin:0 auto 14px}
.sym i{position:absolute;font:700 2.2rem "Bricolage Grotesque",sans-serif;font-style:normal;color:var(--teal);opacity:.12;animation:flo 7s ease-in-out infinite}
@keyframes flo{50%{transform:translateY(-14px) rotate(8deg)}}
.brand{font:800 clamp(2.4rem,7vw,3.6rem)/1 "Bricolage Grotesque",sans-serif;letter-spacing:-.02em}
.brand .m{background:var(--mark);color:var(--markink);padding:0 10px;border-radius:8px;margin-right:4px}
.pbar{height:10px;background:var(--grid);border-radius:6px;overflow:hidden;max-width:360px;margin:12px auto 6px}
.pbar i{display:block;height:100%;background:var(--teal)}
.sec{font-size:1.3rem;margin:26px 0 12px}
aside .gh{font-size:.72rem;letter-spacing:.1em;text-transform:uppercase;color:var(--mute);margin:16px 8px 4px;font-family:"Instrument Sans",system-ui,sans-serif}
aside{transition:width .2s}
@media (min-width:801px){.layout.closed aside{width:0;padding:0;border:0;overflow:hidden}}
@media (prefers-reduced-motion:reduce){.sym i{animation:none}}
.in.wide{max-width:1000px}
.pr{display:grid;grid-template-columns:5fr 6fr;gap:16px;align-items:start}
.help{position:sticky;top:0;margin:16px 0;font-size:.95rem}
.help summary{padding:0;margin-bottom:6px;color:var(--teal);text-transform:uppercase;font-size:.85rem;letter-spacing:.08em;font-weight:700}
.help p{margin:6px 0}
.help .ex{box-shadow:none}
.help .ex li{padding:7px 0 7px 36px}
.ans{display:flex;gap:8px;margin-top:10px}
.ans input{flex:1;min-width:0;padding:10px;border:1.5px solid var(--line);border-radius:8px;background:var(--bg)}
.fb{min-height:1.4em;margin-top:8px;font-weight:600}
.fb.ok{color:var(--teal)}.fb.no{color:#C0392B}
@media (prefers-color-scheme:dark){.fb.no{color:#FF8A80}}
.conf{position:fixed;inset:0;pointer-events:none;z-index:60;overflow:hidden}
.conf i{position:absolute;top:-16px;width:9px;height:14px;border-radius:2px;animation:fall 1.6s ease-in forwards}
@keyframes fall{to{transform:translateY(105vh) rotate(720deg)}}
.flash{position:fixed;inset:0;background:rgba(220,38,38,.4);pointer-events:none;z-index:60;animation:fl 1s forwards}
@keyframes fl{0%{opacity:0}15%,80%{opacity:1}100%{opacity:0}}
.fb .how{display:block;font-weight:400;color:var(--ink);margin-top:4px}
@media (max-width:800px){.pr{grid-template-columns:1fr}.help{position:static}}
@media (max-width:800px){.search{margin-left:0}.logo .wm{display:none}#menuBtn .wm{display:none}
aside{position:fixed;z-index:30;top:calc(60px + env(safe-area-inset-top,0px));bottom:0;left:0;width:min(310px,86vw);transform:translateX(-102%);transition:transform .2s;box-shadow:6px 0 24px rgba(0,0,0,.25)}
aside.open{transform:none}main{padding:22px 16px 48px}}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
<style id="themes">

:root[data-theme="dark"]{--bg:#0F1C26;--grid:#1B3041;--ink:#E8F0EE;--mute:#9DB3BF;--card:#16293A;--line:#2C4558;--teal:#4FD1B8;color-scheme:dark}
:root[data-theme="ocean"]{--bg:#EEF6FB;--grid:#D2E5F2;--ink:#0B2A43;--mute:#48667E;--card:#FFFFFF;--line:#B4D0E4;--teal:#0A6EA8;--mark:#7CD4FF;--markink:#0B2A43;color-scheme:light}
:root[data-theme="forest"]{--bg:#F1F6EE;--grid:#D8E5D0;--ink:#1B3322;--mute:#52684F;--card:#FFFFFF;--line:#BED2B4;--teal:#2E7D32;--mark:#B6E36B;--markink:#1B3322;color-scheme:light}

:root[data-theme="midnight"]{--bg:#11111F;--grid:#1D1D33;--ink:#EDEBFF;--mute:#A9A6CF;--card:#1A1A2E;--line:#33335A;--teal:#8EA2FF;--mark:#FFD23F;--markink:#12263A;color-scheme:dark}

<script>
try{if(!localStorage.getItem("ma-session")){document.body.innerHTML='<div style="font:16px/1.5 system-ui,sans-serif;max-width:460px;margin:60px auto;padding:22px;border:2px solid #12263A;border-radius:14px;background:#fff;color:#12263A;box-shadow:6px 6px 0 #FFD23F"><b style="font-size:1.2rem">Please log in first</b><p>Your dashboard opens after you log in or sign up.</p><p><a href="login.html">Log in</a> &nbsp;·&nbsp; <a href="signup.html">Sign up</a> &nbsp;·&nbsp; <a href="index.html">Home</a></p></div>'}}catch(e){}
// Each topic: [name, what it is, when you'll see it, common mistake, [problem, ...steps]]
const S=[
["arith","+","Arithmetic",[
["Order of operations","The agreed order for evaluating an expression so everyone gets the same answer.","Any expression with more than one operation, like 3 + 4 × 2.","Going left to right and adding first. That gives 28 instead of 19.",["Evaluate 3 + 4 × 2²","Exponents first: 2² = 4, so 3 + 4 × 4","Then multiplication: 4 × 4 = 16, so 3 + 16","Then addition: the answer is 19"]],
["Long division","A way to split a big number into equal groups, one digit at a time.","Dividing numbers too big to do in your head, like 156 ÷ 12.","Forgetting to bring down the next digit.",["156 ÷ 12","12 goes into 15 once. Write 1, subtract 12, remainder 3","Bring down the 6 to make 36","12 goes into 36 three times. Write 3, remainder 0","The answer is 13"]],
["Negative numbers","Numbers below zero. Think of owing money or going below sea level.","Temperatures, debts, and any subtraction that goes past zero.","Treating subtracting a negative as subtracting. 4 − (−2) is the same as 4 + 2 = 6.",["Compute 5 − 8","Start at 5 on a number line and move 8 steps left","You reach 0 after 5 steps, then go 3 more","The answer is −3"]]]],
["frac","½","Fractions & Decimals",[
["Adding fractions","Fractions can only be added when the pieces are the same size, meaning the same denominator.","Adding or subtracting fractions like 1/3 + 1/4.","Adding the denominators too. 1/3 + 1/4 is not 2/7.",["1/3 + 1/4","Find a common denominator: 12","Rewrite both: 4/12 + 3/12","Add the tops, keep the bottom: 7/12"]],
["Percentages","A percent means “out of 100”. 25% is 25 out of every 100, or 0.25.","Discounts, tips, tax, grades, and interest.","Using the wrong base. A 20% discount followed by a 20% increase does not get you back to the original price.",["What is 20% of 80?","Turn 20% into a decimal: 0.20","Multiply: 0.20 × 80","The answer is 16"]],
["Ratios","A ratio compares two quantities, like 2 cups of flour for every 1 cup of sugar.","Recipes, maps, speed, and scaling anything up or down.","Adding instead of multiplying when you scale.",["A recipe uses 2 cups flour to 1 cup sugar. How much sugar for 6 cups of flour?","The ratio flour : sugar is 2 : 1","6 is 3 times 2, so multiply both parts by 3","You need 3 cups of sugar"]]]],
["alg","x","Algebra",[
["Solving linear equations","Finding the value of x that makes both sides equal, by doing the same thing to both sides.","Equations with one unknown, like 3x − 5 = 10.","Changing only one side of the equation.",["3x − 5 = 10","Add 5 to both sides: 3x = 15","Divide both sides by 3: x = 5","Check: 3 · 5 − 5 = 10 ✓"]],
["Factoring quadratics","Rewriting x² + bx + c as a product of two brackets.","Solving quadratic equations or simplifying algebraic fractions.","Choosing numbers that multiply correctly but don’t add up to the middle number.",["Factor x² + 5x + 6","Find two numbers that multiply to 6 and add to 5: 2 and 3","Write (x + 2)(x + 3)","Check by expanding: x² + 3x + 2x + 6 ✓"]],
["Systems of equations","Two equations with two unknowns, solved together to find the one pair of values that fits both.","Problems with two unknown quantities, like the prices of two items.","Finding x and forgetting to go back and find y.",["x + y = 10 and x − y = 2","Add the equations: 2x = 12, so x = 6","Put x = 6 into x + y = 10: y = 4","The answer is x = 6, y = 4"]]]],
["geo","△","Geometry",[
["Area and perimeter","Perimeter is the distance around a shape. Area is the space inside it.","Flooring, fencing, painting, and almost any shape problem.","Mixing up units. Perimeter is in meters, area is in square meters.",["A rectangle is 5 m by 3 m","Perimeter: 2 × (5 + 3) = 16 m","Area: 5 × 3 = 15 m²"]],
["Pythagorean theorem","In a right triangle, a² + b² = c², where c is the longest side.","Finding a missing side of a right triangle, or the distance between two points.","Using it on triangles that don’t have a right angle.",["The legs are 3 and 4. Find the hypotenuse","a² + b² = c², so 9 + 16 = c²","c² = 25","c = 5"]],
["Angles in triangles","The three angles inside any triangle always add up to 180°.","Finding a missing angle, and most geometry proofs.","Using 360°, which is the total for a four-sided shape.",["Two angles are 50° and 60°. Find the third","Add the known ones: 50 + 60 = 110","Subtract from 180: 180 − 110","The answer is 70°"]]]],
["trig","sin","Trigonometry",[
["SOH-CAH-TOA","A memory trick for the three ratios: sin = opposite/hypotenuse, cos = adjacent/hypotenuse, tan = opposite/adjacent.","Finding sides or angles of right triangles, like the height of a ramp.","Labeling opposite and adjacent from the wrong angle.",["A 10 m ramp rises at 30°. How high is it?","The height is opposite the angle and the ramp is the hypotenuse, so use sin","sin 30° = height / 10","Height = 10 × 0.5 = 5 m"]],
["The unit circle","A circle of radius 1 where the point at angle θ has coordinates (cos θ, sin θ).","Finding trig values for any angle, and graphing sine and cosine.","Swapping the two coordinates. x is cosine, y is sine.",["Find sin 90°","Turn 90° counterclockwise from the right side of the circle","You land at the top, the point (0, 1)","The y-coordinate is the sine, so sin 90° = 1"]],
["Radians and degrees","Two ways to measure angles. A full circle is 360° or 2π radians.","Calculus and physics use radians. Everyday geometry uses degrees.","Leaving your calculator in the wrong mode.",["Convert 90° to radians","Multiply by π/180","90 × π/180 = π/2"]]]],
["calc","∫","Calculus",[
["Limits","A limit is the value a function gets closer and closer to as x approaches a point.","The starting idea behind derivatives and integrals.","Stopping at 0/0. That means “simplify more”, not “no answer”.",["Find the limit of (x² − 4)/(x − 2) as x → 2","Plugging in gives 0/0, so simplify first","Factor: (x − 2)(x + 2)/(x − 2) = x + 2","Now plug in x = 2: the limit is 4"]],
["Derivatives: the power rule","A derivative tells you how fast something is changing. It is the slope of the graph.","Speed, growth rates, and finding highest or lowest points.","Forgetting to lower the power by 1.",["Differentiate f(x) = x³","Bring the power down in front: 3x³","Lower the power by 1: 3x²","f′(x) = 3x²"]],

T:Combining like terms
W:Like terms have the same variable part, so you can add or subtract their coefficients.
U:Simplifying expressions like 3x + 5 + 2x − 1 before solving or graphing.
M:Combining terms with different variables or powers, like adding 3x and 3x².
E:Simplify 3x + 5 + 2x − 1~~Group like terms: (3x + 2x) + (5 − 1)~~Add the x-terms: 5x~~Add the numbers: 4~~The answer is 5x + 4
Q:Simplify 4x + 3x. What is the coefficient of x?|7|4x + 3x = 7x, so the coefficient is 7.
Q:Simplify 6y − 2y + 5. What is the coefficient of y?|4|6y − 2y = 4y, so the coefficient is 4 and the expression is 4y + 5.
Q:Simplify 2a + 7 + 3a − 4. What is the constant term?|3|The numbers combine as 7 − 4 = 3, so the expression is 5a + 3.
T:The distributive property
W:a(b + c) = ab + ac. Multiply the number outside the brackets by every term inside.
U:Clearing brackets in expressions and equations, and in mental math.
M:Multiplying only the first term inside the bracket, or losing a negative sign.
E:Expand 3(x + 4)~~Multiply 3 by x to get 3x~~Multiply 3 by 4 to get 12~~The answer is 3x + 12
Q:Expand 5(x + 2). What is the constant term?|10|5 × 2 = 10, so 5(x + 2) = 5x + 10.
Q:Expand −2(x − 3). What is the constant term?|6|−2 × −3 = +6, so −2(x − 3) = −2x + 6.
Q:Use distribution to find 7 × 12 as 7(10 + 2).|84|7 × 10 = 70 and 7 × 2 = 14, and 70 + 14 = 84.
T:Solving multi-step equations
W:Equations that need more than one operation. Simplify each side, then undo the operations in reverse order.
U:Equations like 2(x + 3) − 4 = 10.
M:Forgetting to distribute, or not doing the same thing to both sides.
E:Solve 2(x + 3) − 4 = 10~~Distribute: 2x + 6 − 4 = 10~~Combine: 2x + 2 = 10~~Subtract 2: 2x = 8~~Divide by 2: x = 4
Q:Solve 3x + 2x − 4 = 16. What is x?|4|Combine to get 5x − 4 = 16, so 5x = 20 and x = 4.
Q:Solve 2(x − 1) + 5 = 13. What is x?|5|2x − 2 + 5 = 13 gives 2x + 3 = 13, so 2x = 10 and x = 5.
Q:Solve 4(x + 2) = 3x + 11. What is x?|3|4x + 8 = 3x + 11, so x = 3.
T:Equations with variables on both sides
W:Move all the x terms to one side and all the numbers to the other, then solve.
U:Comparing two prices or plans that both depend on x.
M:Moving a term across the equals sign without changing its sign.
E:Solve 5x − 3 = 2x + 9~~Subtract 2x from both sides: 3x − 3 = 9~~Add 3: 3x = 12~~Divide by 3: x = 4
Q:Solve 7x + 1 = 3x + 13. What is x?|3|Subtract 3x to get 4x + 1 = 13, then 4x = 12 and x = 3.
Q:Solve 5x − 8 = 2x + 4. What is x?|4|Subtract 2x to get 3x − 8 = 4, then 3x = 12 and x = 4.
Q:Solve 3(x + 1) = x + 9. What is x?|3|3x + 3 = x + 9 gives 2x = 6, so x = 3.
T:Inequalities
W:Inequalities compare two sides using <, >, ≤ or ≥. Solve them like equations, but flip the sign when you multiply or divide by a negative number.
U:Budgets, limits, minimums and maximums.
M:Forgetting to flip the inequality sign when dividing by a negative.
E:Solve −2x + 3 > 11~~Subtract 3: −2x > 8~~Divide by −2 and flip the sign: x < −4~~Any x less than −4 works
Q:Solve 2x + 1 < 9. x is less than what?|4|2x < 8, so x < 4.
Q:Solve −3x ≥ 12. x is at most what?|-4|Dividing by −3 flips the sign, so x ≤ −4.
Q:What is the smallest whole number that satisfies x + 5 > 9?|5|x > 4, so the smallest whole number is 5.
T:Absolute value equations
W:abs(x) is the distance of x from zero, so abs(x) = 5 means x = 5 or x = −5.
U:Distances, tolerances and error margins.
M:Forgetting the negative case and finding only one solution.
E:Solve abs(x − 2) = 5~~Two cases: x − 2 = 5 or x − 2 = −5~~First case: x = 7~~Second case: x = −3
Q:Solve abs(x) = 8. What is the positive solution?|8|abs(x) = 8 means x = 8 or x = −8.
Q:Solve abs(x − 1) = 4. What is the larger solution?|5|x − 1 = 4 gives x = 5, and x − 1 = −4 gives x = −3.
Q:Solve abs(2x) = 10. What is the negative solution?|-5|2x = 10 or 2x = −10, so x = 5 or x = −5.
T:Slope
W:Slope measures steepness: rise over run, or (y₂ − y₁) ÷ (x₂ − x₁).
U:Rates of change, ramps and the graph of any line.
M:Subtracting the coordinates in different orders on top and bottom.
E:Find the slope through (1, 2) and (3, 8)~~Rise: 8 − 2 = 6~~Run: 3 − 1 = 2~~Slope = 6 ÷ 2 = 3
Q:Find the slope through (0, 1) and (2, 5).|2|(5 − 1) ÷ (2 − 0) = 4 ÷ 2 = 2.
Q:Find the slope through (1, 7) and (4, 1).|-2|(1 − 7) ÷ (4 − 1) = −6 ÷ 3 = −2.
Q:What is the slope of y = 5x − 2?|5|In y = mx + b the slope is m, which is 5.
T:Graphing lines
W:The line y = mx + b has slope m and crosses the y-axis at b. Plot b first, then use the slope to find more points.
U:Seeing linear relationships such as cost over time.
M:Mixing up slope and intercept, or moving the wrong direction for a negative slope.
E:Graph y = 2x + 1~~The y-intercept is 1, so plot (0, 1)~~The slope 2 means up 2 and right 1, so plot (1, 3)~~Draw a line through the points
Q:Where does y = 3x − 4 cross the y-axis? Give the y-value.|-4|The intercept b is −4.
Q:For y = −x + 6, what is y when x = 2?|4|−2 + 6 = 4.
Q:Where does y = 2x − 6 cross the x-axis? Give the x-value.|3|Set y = 0: 2x = 6, so x = 3.
T:Writing equations of lines
W:Use point-slope form y − y₁ = m(x − x₁) with a point and a slope, then simplify to y = mx + b.
U:Building a line from data points.
M:Sign mistakes with the point’s coordinates.
E:Line with slope 3 through (2, 5)~~Point-slope: y − 5 = 3(x − 2)~~Distribute: y − 5 = 3x − 6~~Add 5: y = 3x − 1
Q:A line has slope 2 and passes through (0, 4). It is y = 2x + what?|4|The point (0, 4) is the y-intercept, so b = 4.
Q:A line has slope 3 and passes through (1, 5). It is y = 3x + what?|2|y − 5 = 3(x − 1) gives y = 3x + 2.
Q:Find the y-intercept of the line through (1, 3) and (3, 7).|1|The slope is 2, so y − 3 = 2(x − 1) gives y = 2x + 1.
T:Parallel and perpendicular lines
W:Parallel lines have equal slopes. Perpendicular lines have slopes that are negative reciprocals of each other.
U:Geometry on the coordinate plane.
M:Taking the reciprocal but forgetting to flip the sign.
E:Find the slope of a line perpendicular to y = 2x + 3~~The given slope is 2~~Reciprocal: 1/2~~Flip the sign: −1/2
Q:What is the slope of a line parallel to y = 4x − 1?|4|Parallel lines have the same slope.
Q:A line has slope −1/4. What is the slope of a perpendicular line?|4|The negative reciprocal of −1/4 is 4.
Q:A line has slope 5. What is the slope of a perpendicular line?|-1/5~-0.2|The negative reciprocal of 5 is −1/5.
T:Systems by substitution
W:Solve one equation for a variable, then substitute it into the other equation.
U:When one variable is already isolated, like y = 2x.
M:Substituting back into the same equation you started from.
E:Solve y = 2x and x + y = 9~~Substitute y = 2x: x + 2x = 9~~3x = 9, so x = 3~~y = 2(3) = 6
Q:Solve y = x + 1 and x + y = 7. What is x?|3|x + (x + 1) = 7 gives 2x = 6, so x = 3.
Q:In the same system, what is y?|4|y = x + 1 = 3 + 1 = 4.
Q:Solve x = 2y and x + y = 12. What is y?|4|2y + y = 12 gives 3y = 12, so y = 4.
T:Systems by elimination
W:Add or subtract the equations so one variable cancels, then solve for the other.
U:When both equations are in standard form like 2x + y = 10.
M:Adding the equations but forgetting to combine every term, or not scaling both sides.
E:Solve 2x + y = 10 and 2x − y = 2~~Add the equations: 4x = 12, so x = 3~~Put x = 3 into 2x + y = 10: 6 + y = 10~~y = 4
Q:Solve 3x + y = 11 and x − y = 1. What is x?|3|Adding gives 4x = 12, so x = 3.
Q:Solve 2x + 3y = 12 and 2x + y = 8. What is y?|2|Subtracting gives 2y = 4, so y = 2.
Q:Solve x + 2y = 7 and 3x − 2y = 5. What is x?|3|Adding gives 4x = 12, so x = 3.
T:Functions and function notation
W:A function gives exactly one output for each input. f(x) means the output of f when the input is x.
U:Describing rules in math, science and programming.
M:Reading f(3) as f times 3.
E:If f(x) = 2x + 1, find f(3)~~Replace x with 3: 2(3) + 1~~6 + 1 = 7
Q:If f(x) = x² + 1, what is f(4)?|17|4² + 1 = 16 + 1 = 17.
Q:If f(x) = 3x − 5, what is f(0)?|-5|3(0) − 5 = −5.
Q:If f(x) = 2x + 3 and f(x) = 11, what is x?|4|2x + 3 = 11 gives 2x = 8, so x = 4.
T:Exponent rules
W:Multiplying powers with the same base adds the exponents. Dividing subtracts them. A power of a power multiplies them.
U:Simplifying algebra and working with scientific notation.
M:Adding exponents in a power of a power, such as writing (x²)³ as x⁵.
E:Simplify x³ · x⁴ and (x²)³~~Same base multiplied: add exponents, x⁷~~Power of a power: multiply exponents, x⁶
Q:x⁵ · x² equals x to what power?|7|5 + 2 = 7.
Q:(x³)⁴ equals x to what power?|12|3 × 4 = 12.
Q:x⁹ ÷ x⁶ equals x to what power?|3|9 − 6 = 3.
T:Multiplying polynomials
W:Multiply every term of one polynomial by every term of the other, then combine like terms. For two binomials this is called FOIL.
U:Expanding products like (x + 2)(x + 5).
M:Dropping the middle terms, like writing (x + 3)² as x² + 9.
E:Expand (x + 2)(x + 5)~~First: x · x = x²~~Outer and inner: 5x + 2x = 7x~~Last: 2 · 5 = 10~~The answer is x² + 7x + 10
Q:(x + 1)(x + 4) = x² + ?x + 4. What is ?|5|x · 4 + 1 · x = 5x.
Q:(x − 2)(x + 3) = x² + ?x − 6. What is ?|1|3x − 2x = x.
Q:(2x + 1)(x + 3) = 2x² + ?x + 3. What is ?|7|2x · 3 + 1 · x = 7x.
T:Special products
W:Three shortcuts: (a + b)² = a² + 2ab + b², (a − b)² = a² − 2ab + b², and (a + b)(a − b) = a² − b².

M:Writing (a + b)² as a² + b² and missing the middle term.

Q:(x + 5)(x − 5) = x² − ?. What is ?|25|The difference of squares gives x² − 25.
Q:(x − 6)² = x² − ?x + 36. What is ?|12|2 · x · 6 = 12x.
T:Factoring: greatest common factor

Q:Factor 4x + 8 as 4(x + ?). What is ?|2|8 ÷ 4 = 2.

Q:Complete the square: x² + 10x + ? What number goes in the blank?|25|Half of 10 is 5, and 5² = 25.
Q:Solve x² + 4x = 5. What is the positive solution?|1|x² + 4x + 4 = 9, so x + 2 = ±3 and x = 1 or −5.
Q:Complete the square: x² − 8x + ? What number goes in the blank?|16|Half of −8 is −4, and (−4)² = 16.
T:Quadratic formula

U:Solving any quadratic, especially ones that do not factor.

T:Graphing quadratics

Q:What is the y-coordinate of the vertex of y = x² − 2x + 3?|2|The vertex is at x = 1, and y = 1 − 2 + 3 = 2.
Q:What is the maximum value of y = −x² + 4x?|4|The vertex is at x = 2, and y = −4 + 8 = 4.

225 ÷ 15 = ?|15|15 goes into 22 once, remainder 7. Bring down 5 to make 75. 15 goes into 75 five times. Answer: 15.

3 − 7 = ?|-4|Start at 3 and move 7 steps left. You pass 0 after 3 steps and go 4 more: −4.
−2 − (−5) = ?|3|Subtracting a negative is the same as adding: −2 + 5 = 3.
(−3) × (−4) = ?|12|A negative times a negative is positive: 3 × 4 = 12.

Pythagorean theorem
The legs are 6 and 8. Find the hypotenuse.|10|6² + 8² = 36 + 64 = 100, and the square root of 100 is 10.
The hypotenuse is 13 and one leg is 5. Find the other leg.|12|13² − 5² = 169 − 25 = 144, and the square root of 144 is 12.
The legs are 9 and 12. Find the hypotenuse.|15|9² + 12² = 81 + 144 = 225, and the square root of 225 is 15.

Angles in triangles
Two angles are 40° and 75°. Find the third angle.|65|Add the known angles: 40 + 75 = 115. Then 180 − 115 = 65.
A right triangle has another angle of 35°. Find the third angle.|55|A right angle is 90°. 90 + 35 = 125, and 180 − 125 = 55.
What is each angle of an equilateral triangle?|60|The three angles are equal and add up to 180, so 180 ÷ 3 = 60.

SOH-CAH-TOA
Which ratio is opposite ÷ hypotenuse? (sin, cos or tan)|sin|SOH stands for Sine = Opposite over Hypotenuse.
tan = opposite ÷ what? (one word)|adjacent|TOA stands for Tangent = Opposite over Adjacent.
The hypotenuse is 20 and the angle is 30°. How long is the opposite side?|10|Use sin: sin 30° = opposite ÷ 20, and sin 30° = 0.5, so opposite = 10.

The unit circle
What is cos 0°?|1|At 0° you are at the point (1, 0). Cosine is the x-coordinate, so it is 1.
What is sin 180°?|0|At 180° you are at (−1, 0). Sine is the y-coordinate, so it is 0.
What is sin 270°?|-1|At 270° you are at (0, −1). Sine is the y-coordinate, so it is −1.

Radians and degrees
Write 180° in radians (type pi for π).|pi|Half a circle is 180°, which is π radians.
Write π/2 radians in degrees.|90|Multiply by 180/π: (π/2) × 180/π = 90°.
Write 360° in radians (type 2pi for 2π).|2pi|A full circle is 360°, which is 2π radians.

Limits
Find the limit of x + 2 as x → 3.|5|x + 2 is smooth, so just plug in x = 3 to get 5.
Find the limit of (x² − 1)/(x − 1) as x → 1.|2|Plugging in gives 0/0, so factor: (x − 1)(x + 1)/(x − 1) = x + 1. At x = 1 that is 2.
Find the limit of (x² + 5x)/x as x → 0.|5|Factor out x: x(x + 5)/x = x + 5. At x = 0 that is 5.

Derivatives: the power rule
Differentiate x⁵ (you can type x^4 style).|5x^4|Bring the 5 down in front and lower the power by 1: 5x⁴.
Differentiate 4x².|8x|Bring the 2 down and multiply by 4: 4 × 2x = 8x.
Differentiate x² + 3x.|2x+3|Differentiate each part: 2x for x², and 3 for 3x. Answer: 2x + 3.

Integrals
Find ∫ 3x² dx (include + C).|x^3+c|Raise the power to get x³, divide by 3, then multiply by the 3 in front: x³ + C.
Find ∫ 4x dx (include + C).|2x^2+c|Raise the power to get x². Divide by 2 and multiply by 4: 2x² + C.
Find ∫ 1 dx (include + C).|x+c|The integral of 1 is x. Don’t forget + C.

Mean, median and mode
Find the mean of 4, 6, 8, 10, 12.|8|Add them: 4 + 6 + 8 + 10 + 12 = 40. Divide by 5 to get 8.
Find the median of 12, 3, 8, 1, 6.|6|Sort the list: 1, 3, 6, 8, 12. The middle value is 6.
Find the mode of 2, 7, 7, 9, 7, 3.|7|7 appears three times, more than any other number.

Standard deviation
What is the standard deviation of 7, 7, 7, 7?|0|Every value equals the mean, so there is no spread: 0.
Find the population variance of 2, 4, 6, 8.|5|The mean is 5. Differences: −3, −1, 1, 3. Squares: 9, 1, 1, 9. Average: 20 ÷ 4 = 5.
A data set has variance 16. What is its standard deviation?|4|Standard deviation is the square root of the variance: √16 = 4.

Probability basics
Probability of heads on a fair coin? (fraction)|1/2~0.5|One favorable outcome (heads) out of 2 possible: 1/2.
Probability of rolling a 5 on a fair die? (fraction)|1/6|One favorable outcome (a 5) out of 6 possible: 1/6.
Probability of two heads in two fair coin flips? (fraction)|1/4~0.25|Multiply independent chances: 1/2 × 1/2 = 1/4.

Matrix multiplication
Multiply the row [2, 3] by the column [4, 5].|23|Multiply matching entries and add: 2 × 4 + 3 × 5 = 8 + 15 = 23.
Multiply the row [1, 0] by the column [7, 9].|7|Multiply matching entries and add: 1 × 7 + 0 × 9 = 7.
Multiply the row [3, −1] by the column [2, 6].|0|Multiply matching entries and add: 3 × 2 + (−1) × 6 = 6 − 6 = 0.

Determinants
Find the determinant of the matrix with rows [2, 1] and [3, 4].|5|Use ad − bc: 2 × 4 − 1 × 3 = 8 − 3 = 5.
Find the determinant of the matrix with rows [5, 2] and [1, 1].|3|Use ad − bc: 5 × 1 − 2 × 1 = 5 − 2 = 3.
Find the determinant of the matrix with rows [1, 2] and [2, 4].|0|Use ad − bc: 1 × 4 − 2 × 2 = 4 − 4 = 0.

Dot product
Find (1, 2) · (3, 4).|11|Multiply matching parts and add: 1 × 3 + 2 × 4 = 11.
Find (2, 0, 1) · (5, 7, 3).|13|Multiply matching parts and add: 2 × 5 + 0 × 7 + 1 × 3 = 13.
Find (1, −1) · (1, 1).|0|Multiply matching parts and add: 1 × 1 + (−1) × 1 = 0.

Sets
A = {1, 2, 3, 4} and B = {3, 4, 5}. How many elements are in A ∪ B?|5|The union has everything in either set: 1, 2, 3, 4, 5. That is 5 elements.
How many elements are in A ∩ B?|2|The intersection is what they share: 3 and 4. That is 2 elements.
How many elements are in the set {a, b, b, c}?|3|Sets don’t repeat, so b counts once: a, b, c is 3 elements.

Permutations vs combinations
In how many ways can you choose 2 people from 5 (order doesn’t matter)?|10|Order doesn’t matter, so use combinations: C(5, 2) = (5 × 4) ÷ 2 = 10.
In how many orders can 3 people stand in a row?|6|Order matters here, and there are 3 × 2 × 1 = 6 arrangements.
How many ways to pick a president and a vice president from 4 people?|12|Order matters (different jobs), so 4 × 3 = 12.

Proof by induction
Which step proves the very first case? (two words)|base case|The first case you check is called the base case.
In the inductive step, you assume the statement is true for n = what? (one letter)|k|In the inductive step you assume the statement is true for n = k.
Use n(n + 1)/2 to add 1 + 2 + 3 + 4.|10|4 × 5 ÷ 2 = 10, and 1 + 2 + 3 + 4 = 10 ✓.

Primes and factorization
Is 1 a prime number? (yes or no)|no|A prime has exactly two factors. 1 has only one, so it isn’t prime.
What is the smallest prime number?|2|The smallest prime is 2, which is also the only even prime.
What is the largest prime factor of 42?|7|42 = 2 × 3 × 7, so the largest prime factor is 7.

GCD and LCM
Find the GCD of 12 and 8.|4|12 = 2² × 3 and 8 = 2³. The lowest powers give 2² = 4.
Find the LCM of 4 and 6.|12|4 = 2² and 6 = 2 × 3. The highest powers give 2² × 3 = 12.
Find the GCD of 18 and 27.|9|18 = 2 × 3² and 27 = 3³. The lowest powers give 3² = 9.

Modular arithmetic
What is 23 mod 7?|2|7 goes into 23 three times (21), so the remainder is 2.
What is 100 mod 9?|1|9 goes into 100 eleven times (99), so the remainder is 1.
It is 10 o’clock. What hour is it 5 hours later on a 12-hour clock?|3|10 + 5 = 15. On a 12-hour clock, 15 − 12 = 3.`;

const pfHTML=(v,sz)=>{v=String(v||"");if(v.indexOf("data:image/")===0)return `<img class="pf pfi" style="width:${sz}px;height:${sz}px" src="${v.replace(/"/g,"")}" alt="">`;
 const i=parseInt(v.split(":")[1],10),a=AN[i>=0&&i<AN.length?i:0];return `<span class="pf" style="width:${sz}px;height:${sz}px;background:${a[0]}"><svg viewBox="0 0 100 100" width="100%" height="100%" aria-hidden="true">${a[1]}</svg></span>`};
function makePicker(host,initial,onChange){
 let val=initial||"anim:0",tab=val.indexOf("data:")===0?"lib":"anim",stream=null;
 const q=(s,r)=>(r||host).querySelector(s);
 const stop=()=>{if(stream){stream.getTracks().forEach(t=>t.stop());stream=null}};
 const prev=()=>{const e=q(".pk-prev");if(e)e.innerHTML=pfHTML(val,72)};
 const set=v=>{val=v;if(onChange)onChange(v);prev();host.querySelectorAll(".pk-grid button").forEach(b=>b.classList.toggle("sel",b.dataset.v===v))};
 const crop=(el,w,h)=>{const c=document.createElement("canvas");c.width=c.height=192;const s=Math.min(w,h);c.getContext("2d").drawImage(el,(w-s)/2,(h-s)/2,s,s,0,0,192,192);return c.toDataURL("image/jpeg",.85)};
 function draw(){stop();
  host.innerHTML=`<div class="pk"><div class="pk-top"><div class="pk-prev"></div><div class="pk-tabs" role="tablist">${[["lib","📁 Photo library"],["cam","📷 Take a photo"],["anim","✨ Animated"]].map(x=>`<button type="button" role="tab" data-t="${x[0]}" aria-selected="${tab===x[0]}">${x[1]}</button>`).join("")}</div></div><div class="pk-body"></div></div>`;
  prev();const body=q(".pk-body");
  host.querySelectorAll("[data-t]").forEach(b=>b.onclick=()=>{tab=b.dataset.t;draw()});
  if(tab==="anim"){body.innerHTML=`<div class="pk-grid">${AN.map((a,i)=>`<button type="button" data-v="anim:${i}" class="${val==="anim:"+i?"sel":""}" aria-label="Animated avatar ${i+1}">${pfHTML("anim:"+i,52)}</button>`).join("")}</div>`;body.querySelectorAll("button").forEach(b=>b.onclick=()=>set(b.dataset.v))}
  else if(tab==="lib"){body.innerHTML=`<input type="file" accept="image/*" aria-label="Choose a photo"><p class="hint">Pick a photo from your library. It’s cropped to a square.</p>`;
   q("input",body).onchange=e=>{const f=e.target.files[0];if(!f||f.type.indexOf("image/")!==0)return;const r=new FileReader();r.onload=()=>{const im=new Image();im.onload=()=>set(crop(im,im.width,im.height));im.src=r.result};r.readAsDataURL(f)}}
  else{body.innerHTML=`<button type="button" class="btn" id="pkCam">Open camera</button><video playsinline muted hidden></video><button type="button" class="btn fill" id="pkSnap" hidden>Take photo</button><p class="hint"></p>`;
   const v=q("video",body),hint=q(".hint",body);
   q("#pkCam",body).onclick=()=>{if(!navigator.mediaDevices||!navigator.mediaDevices.getUserMedia){hint.textContent="The camera isn’t available here. Try Photo library instead.";return}
    navigator.mediaDevices.getUserMedia({video:{facingMode:"user"}}).then(s=>{stream=s;v.srcObject=s;v.hidden=false;v.play();q("#pkSnap",body).hidden=false;q("#pkCam",body).hidden=true}).catch(()=>{hint.textContent="Couldn’t open the camera. Check your permissions or use Photo library."})};
   q("#pkSnap",body).onclick=()=>{if(v.videoWidth)set(crop(v,v.videoWidth,v.videoHeight));stop();draw()}}
 }
 draw();return {stop,get:()=>val};
}

function openSettings(){

 $("#setBody").innerHTML=`

 $("#svU").onclick=()=>{const v=$("#iu").value.trim();if(!/^[A-Za-z0-9_]{3,20}$/.test(v))return say("stU","Use 3–20 letters, numbers or underscores.","err");const q=prof();q.username=v;LSs("ma-profile",JSON.stringify(q));say("stU","Saved ✓","ok");chip()};
 $("#svE").onclick=()=>{const v=$("#ie").value.trim();if(!/^\S+@\S+\.\S+$/.test(v))return say("stE","Enter a valid email address.","err");const q=prof();q.email=v.toLowerCase();LSs("ma-profile",JSON.stringify(q));say("stE","Saved ✓","ok")};
 $("#svP").onclick=async()=>{const q=prof(),a=$("#ip0").value,n=$("#ip").value;
  if(n.length<8)return say("stP","Use at least 8 characters.","err");
  if(q.hash&&q.hash!==await maHash(a,q.salt))return say("stP","Your current password isn’t right.","err");
  q.salt=Math.random().toString(36).slice(2);q.hash=await maHash(n,q.salt);LSs("ma-profile",JSON.stringify(q));$("#ip0").value=$("#ip").value="";say("stP","Password updated ✓","ok")};
 $("#sl").onchange=e=>LSs("ma-lang",e.target.value);
 dlg.querySelectorAll("[data-th]").forEach(b=>b.onclick=()=>{setTheme(b.dataset.th);dlg.querySelectorAll("[data-th]").forEach(x=>x.setAttribute("aria-pressed",x===b))});
 $("#out").onclick=()=>{LSd("ma-session");location.href="index.html"};

 let pend=p.avatar||"anim:0";curPk=makePicker($("#pk"),pend,v=>pend=v);

 dlg.showModal();
}
